root = "."
tmp_dir = "tmp"

[build]
cmd = "templ generate && go build -o ./tmp/main . && npm run build"
bin = "tmp/main"
full_bin = "./tmp/main"
include_ext = ["go", "templ"]
exclude_dir = ["assets", "tmp", "vendor", "node_modules"]
include_dir = []
exclude_file = []
exclude_regex = ["_templ.go"]
delay = 1000
stop_on_error = true
send_interrupt = false
kill_delay = 500

[log]
time = false

[color]
main = "magenta"
watcher = "cyan"
build = "yellow"
runner = "green"

[misc]
clean_on_exit = true


